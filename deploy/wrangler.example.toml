# 复制为 deploy/wrangler.toml 并填入自己的值（wrangler.toml 已被 gitignore）
name = "newsdesk"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

[vars]
OCI_REGION    = "us-phoenix-1"
OCI_NAMESPACE = "你的-object-storage-namespace"   # oci os ns get 可查
OCI_BUCKET    = "你的公开桶名"

[[routes]]
pattern   = "news.example.com/*"
zone_name = "example.com"
