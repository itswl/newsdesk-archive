# newsdesk 配置 —— 改这里就够，不用动任何脚本。

# ── 分析引擎 ──
ENGINE=claude                    # 默认用哪个（claude | codex）
CLAUDE_MODEL=claude-sonnet-5
CODEX_MODEL=gpt-5.6-luna

# ── GitHub API ──
# Trending 任务单次约 190 次调用，未认证只有 60 次/小时，所以令牌基本是必需的。
# 留空时若本机装了 gh 且已登录，会自动借用它的令牌；都没有则退化为未认证。
# 只读公开仓库即可，建 fine-grained token 时不用勾任何额外权限。
GITHUB_TOKEN=

# ── 对外发布（可选）──
# 只在本机看简报的话，下面三项全部留空即可：备份与发布会自动跳过，
# deploy/ 目录也不用管。静态站在 site/ 下，浏览器直接打开就能看。
#
# 想让别人也能访问，才需要填。NAMESPACE 留空会自动探测。
BACKUP_BUCKET=                   # 私有桶：data/ + reports/ + site/ 全量备份，留空则不备份
PUBLISH_BUCKET=                  # 公开桶：只放 site/，留空则不发布
BACKUP_NAMESPACE=

# ── 提示 ──
# 复制本文件为 bin/config.conf 再填真实值；config.conf 已被 gitignore，
# 不会进版本控制。namespace 留空时由 `oci os ns get` 自动探测。

# ── 站点声明 ──
# 侵权联系方式，显示在每页页脚。留空则只显示「请与本站联系」不给出具体地址。
# 对外地址，用于生成 Atom feed（feed 里的链接必须是绝对地址）。
# 留空则不生成 feed——只在本机看的话不需要。
SITE_URL=

CONTACT=
