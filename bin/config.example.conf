# newsdesk 配置 —— 改这里就够，不用动任何脚本。

# ── 分析引擎 ──
ENGINE=claude                    # 默认用哪个（claude | codex）
CLAUDE_MODEL=claude-sonnet-5
CODEX_MODEL=gpt-5.6-luna

# ── GitHub API（可选）──
# 留空也能跑：Trending 采集已压到约 50 次调用，装得进未认证的 60 次/小时预算，
# 核心字段（星标、fork、授权、停更、年龄）全部保留。预算不足时会跳过部分仓库
# 和下载量指标，并在报告里说明缺口。
# 填了令牌则预算变 5000，采集深度不受限。留空时若本机装了 gh 且已登录会借用它
# 的令牌；想显式不用认证就填 none。
GITHUB_TOKEN=

# ── 告警（强烈建议配）──
# 不配也能跑，但这条流水线的失败闭环只写在报告和站点状态条里，那只有
# 「已经打开页面的人」才看得见。整条停摆（机器没开、调度器挂了、沙箱自检
# 不过导致拒绝运行）不会有任何人知道——最安全的失败方式同时也是最沉默的。
#
# 任务终局失败、错过补跑、调度循环连续异常、日终核对有缺口，都会推一条。
# 两种形状自动区分：
#   URL 里含 {{TEXT}}  → GET，正文 urlencode 进 URL（Bark / ntfy 这类）
#   否则               → POST JSON，默认体 {"title":..,"text":..}
ALERT_WEBHOOK=
# 自定义 POST 体（飞书/钉钉/Slack 的形状各不相同）。留空用默认体。
#   飞书/Lark: {"msg_type":"text","content":{"text":"{{TEXT}}"}}
#   钉钉: {"msgtype":"text","text":{"content":"{{TEXT}}"}}
#   Slack: {"text":"{{TEXT}}"}
ALERT_PAYLOAD=
# 注意这几家（飞书/Lark、钉钉、企业微信）**错误也返回 HTTP 200**，把失败写在
# body 的 code/errcode 里。alert.py 会一并检查 body，所以体写错时它报「发送失败」
# 而不是假装成功——告警通道静默失效比没有告警更糟。

# ⚠️ 本机的调度器报不了自己的死：机器关了、进程被杀，它没机会发任何东西。
# 想覆盖「整机不在」，需要一个外部监控轮询站点上的 status.json，看时间戳
# 是否变陈旧（uptime-kuma / betteruptime / cron 在别的机器上都行）。
# 只有配了 PUBLISH_BUCKET 才会发布这个文件。

# ── 对外发布（可选）──
# 只在本机看简报的话，下面三项全部留空即可：备份与发布会自动跳过，
# deploy/ 目录也不用管。静态站在 site/ 下，浏览器直接打开就能看。
#
# 想让别人也能访问，才需要填。NAMESPACE 留空会自动探测。
BACKUP_BUCKET=                   # 私有桶：data/ + reports/ + site/ 全量备份，留空则不备份
PUBLISH_BUCKET=                  # 公开桶：只放 site/，留空则不发布
BACKUP_NAMESPACE=

# ── 提示 ──
# 复制本文件为 bin/config.conf 再填真实值；config.conf 已被 gitignore，
# 不会进版本控制。namespace 留空时由 `oci os ns get` 自动探测。

# 对外只保留最近多少天。留空或 0 = 不限制（发布全部历史）。
# 只影响发布：本地 site/ 与私有桶备份始终是全量，reports/ 里的原文也不受影响。
# 改小之后，公开桶里超窗的旧页面会在下次发布时被删掉——不只是不再放链接，
# 是按 URL 也取不到（桶列不出清单，但地址是能猜的）。
PUBLIC_DAYS=

# ── 站点声明 ──
# 侵权联系方式，显示在每页页脚。留空则只显示「请与本站联系」不给出具体地址。
# 对外地址，用于生成 Atom feed（feed 里的链接必须是绝对地址）。
# 留空则不生成 feed——只在本机看的话不需要。
SITE_URL=

CONTACT=
